<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASIO fx-9860GII × ESP32-C3 SuperMini — Interaktive 3D-Bauanleitung</title>
    <meta
      name="description"
      content="Interaktive, anfängerfreundliche 3D-Bauanleitung für den unsichtbaren Hardware-Umbau eines CASIO fx-9860GII Grafikrechners mit einem ESP32-C3 SuperMini und Gemini API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0c0f;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      }
      #boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      #boot-spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(255, 255, 255, 0.16);
        border-top-color: #2997ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-sky-500/30">
    <div id="root">
      <div id="boot-loader">
        <div id="boot-spinner"></div>
        <div style="font-size:14px;font-weight:600;letter-spacing:-0.01em;">
          CASIO fx-9860GII × ESP32-C3 3D-Studio wird geladen…
        </div>
        <div id="boot-error" style="font-size:12px;color:#f87171;max-width:480px;display:none;"></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (ev) {
        var box = document.getElementById('boot-error');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'Ladefehler: ' + (ev.message || 'Unbekannter Fehler');
        }
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var box = document.getElementById('boot-error');
        if (box) {
          box.style.display = 'block';
          box.textContent = 'Fehler: ' + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
